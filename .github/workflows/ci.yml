name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Nightly, and on demand: replay every row of mutations.toml (deliberate
  # breaks that a named test must catch) with `--broad`.
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

# The event name is part of the group so the nightly run is not in the same
# group as pushes to main. A newer push to a pull request supersedes the older
# run; on main every commit gets its full catalogue replay, and the nightly
# audit always finishes, so a later run never cancels either.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # The ckdev-mutate runner that replays mutations.toml (cortexkit/commons,
  # crate cortexkit-mutate 0.9.5), pinned so a runner change never alters CI
  # unannounced.
  CKDEV_MUTATE_REV: 73c7e66145e131eadffdd874c82d93548868b668

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - run: bun install --frozen-lockfile
      - run: bun run types
      - run: bun run build
      - run: bun run test
      - run: bun run format:check
      - run: bun run lint
  # Runs the plugin's OpenCode 2 entry, packed as a consumer installs it, in
  # the real OpenCode 2 CLI (installed from npm at test time, pinned in the
  # test) against a loopback mock of the Codex backend. It fails when a host
  # release stops carrying the pool account to the wire, rerouting a refused
  # request, recording quota, or storing logins in the pool.
  opencode2-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: OpenCode 2 end to end
        env:
          OPENAI_AUTH_OPENCODE2_E2E: "1"
        working-directory: packages/opencode
        run: bun test src/tests/opencode2-e2e.test.ts
  # Runs the plugin's OpenCode 1 entry, from this checkout's build, in the
  # real OpenCode 1 binary (`opencode-ai` from npm, pinned in the test) over
  # an install that has not moved into the account pool. It fails when the
  # move does not happen on OpenCode 1's own plugin client, or when the
  # request after it is not served from the pool.
  opencode1-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: OpenCode 1 end to end
        env:
          OPENAI_AUTH_OPENCODE1_E2E: "1"
        working-directory: packages/opencode
        run: bun test src/tests/opencode1-e2e.test.ts
  # Replays the mutation proofs a pull request touches: each selected row of
  # mutations.toml breaks one guarded line, and its named test must fail. Diff
  # selection sees edits to a row's target or test file and to the row itself,
  # not to helpers the test uses; the full replay on main covers those.
  mutations-pr:
    if: github.event_name == 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - run: bun install --frozen-lockfile
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        id: mutate-cache
        with:
          path: ~/.cargo/bin/ckdev-mutate
          key: ${{ runner.os }}-${{ runner.arch }}-ckdev-mutate-${{ env.CKDEV_MUTATE_REV }}
      - name: Install pinned mutation runner
        if: steps.mutate-cache.outputs.cache-hit != 'true'
        run: cargo install --locked --git https://github.com/cortexkit/commons --rev "$CKDEV_MUTATE_REV" cortexkit-mutate
      - run: ckdev-mutate check
      - name: Replay proofs selected by the PR diff
        run: |
          mkdir -p mutations-report
          ckdev-mutate run --diff origin/main --report mutations-report/diff.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: mutations-pr
          path: mutations-report/diff.json
  # On a push to main: the full catalogue. Nightly or on demand: the same
  # catalogue with `--broad`. Bun test rows are command rows, which cannot
  # observe other test targets, so `--broad` replays them as a plain run does;
  # it is kept so a future Cargo row, or a runner that adds breadth for
  # command rows, is audited without a workflow change.
  mutations-main:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - run: bun install --frozen-lockfile
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        id: mutate-cache
        with:
          path: ~/.cargo/bin/ckdev-mutate
          key: ${{ runner.os }}-${{ runner.arch }}-ckdev-mutate-${{ env.CKDEV_MUTATE_REV }}
      - name: Install pinned mutation runner
        if: steps.mutate-cache.outputs.cache-hit != 'true'
        run: cargo install --locked --git https://github.com/cortexkit/commons --rev "$CKDEV_MUTATE_REV" cortexkit-mutate
      - run: ckdev-mutate check
      - name: Replay the full catalogue
        run: |
          mkdir -p mutations-report
          ckdev-mutate run --all ${BROAD:+--broad} --report mutations-report/all.json
        env:
          BROAD: ${{ github.event_name != 'push' && 'true' || '' }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: mutations-${{ github.event_name == 'push' && 'main' || 'broad' }}
          path: mutations-report/all.json

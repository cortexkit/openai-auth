name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to a pull request supersedes the older run. On main every
# commit keeps its own run, because a release checks CI on its exact commit.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
      - run: bun install --frozen-lockfile
      - name: Install locked OpenCode host fixtures without lifecycle scripts
        run: |
          for host in opencode1 opencode2; do
            npm ci --ignore-scripts --prefix packages/opencode/src/tests/fixtures/$host-host || exit
          done
      - run: bun run types
      - run: bun run build
      - run: bun run test
      - run: bun run format:check
      - run: bun run lint
  # Runs the plugin's OpenCode 2 entry, packed as a consumer installs it, in
  # the real OpenCode 2 CLI (pinned in its locked fixture) against a loopback
  # mock of the Codex backend. It fails when a host
  # release stops carrying the pool account to the wire, rerouting a refused
  # request, recording quota, or storing logins in the pool.
  opencode2-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
      - run: bun install --frozen-lockfile
      - name: Install locked OpenCode host fixtures without lifecycle scripts
        run: |
          for host in opencode1 opencode2; do
            npm ci --ignore-scripts --prefix packages/opencode/src/tests/fixtures/$host-host || exit
          done
      - run: bun run build
      - name: OpenCode 2 end to end
        env:
          OPENAI_AUTH_OPENCODE2_E2E: "1"
        working-directory: packages/opencode
        run: bun test src/tests/opencode2-e2e.test.ts
  # Runs the plugin's OpenCode 1 entry, from this checkout's build, in the
  # real OpenCode 1 binary (`opencode-ai`, pinned in its locked fixture) over
  # an install that has not moved into the account pool. It fails when the
  # move does not happen on OpenCode 1's own plugin client, or when the
  # request after it is not served from the pool.
  opencode1-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
      - run: bun install --frozen-lockfile
      - name: Install locked OpenCode host fixtures without lifecycle scripts
        run: |
          for host in opencode1 opencode2; do
            npm ci --ignore-scripts --prefix packages/opencode/src/tests/fixtures/$host-host || exit
          done
      - run: bun run build
      - name: OpenCode 1 end to end
        env:
          OPENAI_AUTH_OPENCODE1_E2E: "1"
        working-directory: packages/opencode
        run: bun test src/tests/opencode1-e2e.test.ts
  # The one-time move of the runtime files into the state home on Windows,
  # where owner-only files and folders go through the private-files ACLs,
  # links are junctions and an open file can refuse to be removed.
  runtime-layout-windows:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
      - run: bun install --frozen-lockfile
      - name: Runtime layout move
        working-directory: packages/opencode
        run: bun test src/tests/runtime-layout.test.ts

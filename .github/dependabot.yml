version: 2
enable-beta-ecosystems: true
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      # A test-only pin to the exact parser OpenCode 1 ships: the WebSocket
      # recovery tests prove how that version reads our stream, so it moves
      # when the supported OpenCode release moves, not when a new one exists.
      - dependency-name: "@ai-sdk/openai"
      # The TUI runs on the host's single Solid runtime, and common-auth and
      # OpenTUI declare that exact solid-js version as a peer. A newer copy here
      # splits common-auth into separate installed copies, so it moves only
      # when OpenCode's runtime moves.
      - dependency-name: "solid-js"
      # claustrum-client depends on its own subc-client range, and both must
      # share one installed copy, so subc-client moves only together with
      # claustrum-client and common-auth.
      - dependency-name: "@cortexkit/subc-client"
      # tsdown is pinned to 0.23.1: 0.23.2 pulls a rolldown-plugin-dts beta
      # that needs the classic TypeScript API, which TS 7 has none of.
      # Unpin once rolldown-plugin-dts supports TS 7.
      - dependency-name: "tsdown"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

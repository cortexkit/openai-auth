version: 2
enable-beta-ecosystems: true
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      # A test-only pin to the exact parser OpenCode 1 ships: the WebSocket
      # recovery tests prove how that version reads our stream, so it moves
      # when the supported OpenCode release moves, not when a new one exists.
      - dependency-name: "@ai-sdk/openai"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

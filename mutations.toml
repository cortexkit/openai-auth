# Non-retryable messages are fixed text. OpenCode's retry policy also matches
# error text against retryable patterns, and a match overrides the
# non-retryable flag, so provider or peer wording ("Rate limit reached",
# "503") must never be interpolated. CortexKit's worker supervisor
# (prefrontal) auto-resumes a session that ends with
# TERMINAL_AFTER_OUTPUT_MESSAGE, matching it exactly.

[[control]]
id = "ws-terminal-message-carries-no-provider-text"
guards = "the after-output transport failure surfaces only TERMINAL_AFTER_OUTPUT_MESSAGE, without the failure's own text"
file = "packages/opencode/src/ws.ts"
old = "      const message = TERMINAL_AFTER_OUTPUT_MESSAGE\n"
new = "      const message = `${TERMINAL_AFTER_OUTPUT_MESSAGE} (${error.message})`\n"
test_file = "packages/opencode/src/tests/ws-pool.test.ts"
runner = "command"
command = ["bun", "test", "--cwd", "packages/opencode", "./src/tests/ws-pool.test.ts", "-t", "{test}"]
test_count_pattern = "Ran {count} test"
expect_red = ["^transport\\sclose\\sprovenance\\sa\\sclose\\safter\\soutput\\ssays\\swhy\\sit\\swas\\snot\\sretried$"]
expect_message = "records what ended it. (WebSocket closed before response.completed"

[[control]]
id = "ws-protocol-error-after-output-carries-no-provider-text"
guards = "a wrapped provider error after output surfaces only the fixed terminal message"
file = "packages/opencode/src/ws.ts"
old = "        new Error(TERMINAL_AFTER_OUTPUT_MESSAGE, { cause: error }),"
new = "        new Error(`${TERMINAL_AFTER_OUTPUT_MESSAGE} ${wrappedError.message}`, { cause: error }),"
test_file = "packages/opencode/src/tests/ws-tool-call-recovery.test.ts"
runner = "command"
command = ["bun", "test", "--cwd", "packages/opencode", "./src/tests/ws-tool-call-recovery.test.ts", "-t", "{test}"]
test_count_pattern = "Ran {count} test"
expect_red = ["^wrapped\\sprotocol\\serror\\safter\\soutput\\s\\(real\\sAI\\sSDK\\sparser\\)\\safter\\sstreamed\\stext\\sit\\ssurfaces\\sonly\\sthe\\sfixed\\sterminal\\smessage$"]
expect_message = "/Received: \"The response ended early[^\"]*records what ended it\\. \\S/"

[[control]]
id = "ws-oversized-message-carries-no-peer-reason"
guards = "a 1009 size refusal surfaces only OVERSIZED_FRAME_MESSAGE, without the peer's close reason"
file = "packages/opencode/src/ws.ts"
old = "        ? OVERSIZED_FRAME_MESSAGE\n"
new = "        ? `${OVERSIZED_FRAME_MESSAGE} (${event.reason})`\n"
test_file = "packages/opencode/src/tests/ws-tool-call-recovery.test.ts"
runner = "command"

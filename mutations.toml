test_count_pattern = "Ran {count} test"
expect_red = ["^websocket\\sfailure\\safter\\sfunction\\scalls\\sonly\\s\\(real\\sAI\\sSDK\\sparser\\)\\sa\\ssize\\srefusal\\swhile\\sthe\\sonly\\scall\\sis\\sstill\\sstreaming\\ssurfaces\\sonly\\sthe\\sfixed\\smessage$"]

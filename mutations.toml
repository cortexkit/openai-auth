[[control]]
id = "opencode2-host-refresh-family-not-imported"
guards = "the host and pool must never become competing refresh owners of a pre-existing host ChatGPT token family"
file = "packages/opencode/src/v2/setup.ts"
old = "  const models = await registerCodexModelRules(ctx)"
new = """  const models = await registerCodexModelRules(ctx)
  // NON-VACUITY BREAK: restore automatic import of the host's live OAuth family.
  const connection = await ctx.integration.connection.active(OPENAI_PROVIDER_ID)
  const value = connection ? await ctx.integration.connection.resolve(connection) : undefined
  if (value?.type === 'oauth' && value.refresh && !isLeftoverCredential(value)) {
    const accountId = typeof value.metadata?.accountID === 'string'
      ? value.metadata.accountID : crypto.randomUUID()
    await writeLoginToPool(source.poolStore(), paths(), {
      id: accountId,
      accountId,
      access: value.access,
      refresh: value.refresh,
      expires: value.expires,
    }, { origin: 'import' })
    await source.load()
  }"""
test_file = "packages/opencode/src/tests/opencode2-active-connection.test.ts"
runner = "command"
command = ["bun", "test", "--cwd", "packages/opencode", "./src/tests/opencode2-active-connection.test.ts", "-t", "{test}"]
test_count_pattern = "Ran {count} test"
expect_red = ["^OpenCode\\s2\\sactive\\sconnection\\sgate\\snever\\sreads\\sor\\scopies\\sa\\spre-existing\\shost\\sChatGPT\\slogin\\sinto\\sthe\\spool$"]



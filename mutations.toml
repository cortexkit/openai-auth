id = "vault-start-opens-watches"
guards = "OpenAiVault.start runs the shared consumer's poll, which opens the vault watch, so an idle vault-mode host stops listing the vault on every poll"
file = "packages/core/src/vault.ts"
old = "    this.#consumer.start()"
new = """
    // NON-VACUITY BREAK: the poll openai-auth ran itself before common-auth
    // 0.21.0, which lists the vault on every tick and never opens a watch.
    const tick = async () => {
      try {
        await this.#discover()
        await this.#consumer.refreshInsulaQuota()
      } catch {}
      if (this.#closed) return
      const delay = this.#options.pollIntervalMs ?? 5_000
      if (delay <= 0) return
      ;(this.#options.setTimeoutImpl ?? setTimeout)(() => void tick(), delay)
    }
    void tick()"""
edits = []
test_file = "packages/core/src/tests/vault-watch.test.ts"
runner = "command"
command = ["bun", "test", "--cwd", "packages/core", "./src/tests/vault-watch.test.ts", "-t", "{test}"]
list_command = ["bun", "scripts/list-bun-tests.mjs", "--cwd", "packages/core", "./src/tests/vault-watch.test.ts", "-t", "{test}"]
test_count_pattern = "Ran {count} test"
expect_red = ["^vault watch an idle vault with an open watch lists the vault only when a notice shows a change$"]
expect_message = "timed out waiting: the vault watch"
only = false
timeout_s = 600
build_timeout_s = 1800

# Prepaid workspace credits reach the pool's quota map (the vault roster in
# vault mode) and the sidebar file, or nothing shows them.

[[control]]
id = "prepaid-credits-observation"
guards = "a usage poll's prepaid credits are kept in the pool observation, so they reach the vault roster and the sidebar"
file = "packages/core/src/pool-quota.ts"
old = "    ...(prepaid ? { credits: prepaid } : {}),"
new = "    ...(false && prepaid ? { credits: prepaid } : {}), // NON-VACUITY BREAK"
test_file = "packages/opencode/src/tests/prepaid-credits.test.ts"
runner = "command"
command = ["bun", "test", "--cwd", "packages/opencode", "./src/tests/prepaid-credits.test.ts", "-t", "{test}"]
list_command = ["bun", "scripts/list-bun-tests.mjs", "--cwd", "packages/opencode", "./src/tests/prepaid-credits.test.ts", "-t", "{test}"]
test_count_pattern = "Ran {count} test"
expect_red = ['^prepaid\scredits\sfrom\sthe\sCodex\sbackend\svault\smode:\susage-poll\scredits\sreach\sthe\svault\sroster\sand\ssidebar-state\.json\swith\sthe\spoll\stime$']
expect_message = "expect((await rosterRow(env.vault)).quota?.credits).toEqual(credits)"


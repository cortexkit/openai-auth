# Mutation proofs replayed by the pinned ckdev-mutate runner (cortexkit/commons,
# crate cortexkit-mutate; the revision is CKDEV_MUTATE_REV in
# .github/workflows/ci.yml).
#
# Each row is one deliberate break of production code or fixture isolation
# and the named Bun test
# that must go red for it. The runner first runs each named test on the
# unmutated tree (it must pass), applies the break, runs the test again (it
# must fail), and restores the exact bytes. A row earns its place by guarding
# a silent, costly failure: a credential lost or leaked, a reset credit spent
# twice, output replayed, a crash that loses an account, a wire contract.

# Send-time eligibility and vault admission on the migrated request paths.


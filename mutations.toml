#
# Command rows run from the repository root, without a shell:
#   bun test --cwd <package> ./<test file> -t <expect_red>
# Bun's -t is a JavaScript regular expression over the test's full name, which
# is the describe names and the test name joined by single spaces (not " > ",
# as the console output prints them). The runner forbids whitespace in an
# expected id, so each id is the full name anchored with ^ and $, spaces
# written as \s and regex metacharacters escaped. "Ran {count} test" is Bun's
# executed-test summary ("Ran 1 test across 1 file."); a filter that matches
# no test prints no such line and the row errors instead of passing.
#
# No row needs a build: every guarding test imports the TypeScript sources
# directly (the core package's exports point at src/), so a mutant takes effect
# without rebuilding dist/.

# The no-replay gate (packages/opencode/src/ws.ts). Once a turn has streamed
# anything OpenCode shows or acts on (text, reasoning, a finished tool call), a
# cut turn must not be sent again: a replay duplicates text, re-runs tools and
# bills twice. Only an unfinished function call or an empty reasoning item
# leaves a turn retryable. Envelope frames (codex.* and response.created) carry
# transport metadata that OpenCode never displays, so they are not output.

[[control]]
id = "ws-output-frame-sets-emitted-output"
guards = "a frame the reader sees marks the turn as having emitted output, so a cut after it is not retried"
file = "packages/opencode/src/ws.ts"
old = "      emittedOutput = true\n      recordEmittedCallFrame"
new = "      emittedOutput = false\n      recordEmittedCallFrame"
test_file = "packages/opencode/src/tests/ws-pool.test.ts"
runner = "command"
command = ["bun", "test", "--cwd", "packages/opencode", "./src/tests/ws-pool.test.ts", "-t", "{test}"]
test_count_pattern = "Ran {count} test"
expect_red = ["^transport\\sclose\\sprovenance\\sa\\sclose\\safter\\soutput\\ssays\\swhy\\sit\\swas\\snot\\sretried$"]
expect_message = "Received: \"WebSocket closed before response.completed (code 1006"


runner = "command"
command = ["bun", "test", "--cwd", "packages/opencode", "./src/tests/vault.test.ts", "-t", "{test}"]
test_count_pattern = "Ran {count} test"
expect_red = ['^vault\scachekeep\sa\spinned\svault\swarm\sauthorizes\seach\sreplay\sand\sreaches\sCodex\swith\sthe\sserved\stoken$']

